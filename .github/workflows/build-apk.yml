name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install

      - name: Copy web files to www
        run: |
          mkdir -p www
          cp index.html style.css script.js ICION.png www/
          cp -r assets www/

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore android/release.keystore \
            -alias kidslearning -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass opencode123 -keypass opencode123 \
            -dname "CN=KidsLearning, OU=Dev, O=KidsLearning, L=City, S=State, C=PK"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
